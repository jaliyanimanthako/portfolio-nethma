name: Deploy preview on push to dev

on:
  push:
    branches:
      - dev

jobs:
  deploy_dev_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_NETHMA }}
          projectId: portfolio-nethma
          channelId: dev
          expires: 30d
